query StartData(
	$newsItems: IntType
	$programItems: IntType
	$date: Date
	$yearId: ItemId
	$locale: SiteLocale
) {
	allNews(
		locale: $locale
		first: $newsItems
		orderBy: _createdAt_DESC
		filter: { slug: { neq: null } }
	) {
		...NewsFragmentLight
	}
	allPrograms(
		filter: { startDate: { gte: $date }, year: { eq: $yearId }, slug: { neq: null } }
		locale: $locale
		fallbackLocales: [sv]
		first: $programItems
		orderBy: startDate_DESC
	) {
		...ProgramFragmentLight
	}
	allParticipants(
		filter: { year: { eq: $yearId }, slug: { neq: null } }
		first: 100
		orderBy: _createdAt_DESC
		locale: $locale
		fallbackLocales: [sv]
	) {
		...ParticipantFragmentLight
	}
}
