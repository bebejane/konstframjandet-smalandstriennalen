query Menu($locale: SiteLocale, $altLocale: SiteLocale, $yearId: ItemId) {
	allAbouts(
		filter: { OR: [{ year: { eq: $yearId } }, { year: { exists: false } }] }
		first: 100
		locale: $locale
		fallbackLocales: [sv]
	) {
		id
		title
		slug
		altSlug: slug(locale: $altLocale)
		year {
			title
		}
	}
	allYears(
		filter: { id: { neq: $yearId } }
		locale: $locale
		fallbackLocales: [sv]
		first: 100
		orderBy: title_DESC
	) {
		...YearFragment
	}
	year(
		filter: { id: { eq: $yearId } }
		locale: $locale
		fallbackLocales: [sv]
		orderBy: title_DESC
	) {
		id
		title
	}
	_allAboutsMeta(filter: { OR: [{ year: { eq: $yearId } }, { year: { exists: false } }] }) {
		count
	}
	_allProgramsMeta(filter: { year: { eq: $yearId } }) {
		count
	}
	_allParticipantsMeta(filter: { year: { eq: $yearId } }) {
		count
	}
	_allPartnersMeta(filter: { year: { eq: $yearId } }) {
		count
	}
	_allExhibitionsMeta(filter: { year: { eq: $yearId } }) {
		count
	}
	_allLocationsMeta(filter: { year: { eq: $yearId } }) {
		count
	}
}
