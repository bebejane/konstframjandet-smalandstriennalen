query Site ($locale: SiteLocale) {
	_site (locale: $locale) {
		...SiteFragment
	}
}
fragment SiteFragment on Site {
	faviconMetaTags {
		attributes
		content
		tag
	}
	globalSeo {
		facebookPageUrl
		siteName
		titleSuffix
		twitterAccount
		fallbackSeo {
			description
			title
			twitterCard
			image {
				...ImageFragment
			}
		}
	}
}
